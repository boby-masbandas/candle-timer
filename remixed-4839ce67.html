<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candle Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c0f;
    --surface: #0d1318;
    --border: #1a2630;
    --green: #00e5a0;
    --green-dim: #00996b;
    --red: #ff4d6a;
    --amber: #f0a500;
    --text: #c8d8e0;
    --muted: #4a6070;
    --glow-green: 0 0 20px rgba(0,229,160,0.35);
    --glow-amber: 0 0 20px rgba(240,165,0,0.35);
    --glow-red: 0 0 20px rgba(255,77,106,0.35);
  }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .app {
    position: relative;
    z-index: 10;
    width: 380px;
    padding: 0;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: 6px;
    text-shadow: var(--glow-green);
    text-transform: uppercase;
  }

  /* Timeframe selector */
  .tf-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 28px;
  }

  .tf-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 8px 0;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
  }

  .tf-btn:hover {
    border-color: var(--green-dim);
    color: var(--text);
  }

  .tf-btn.active {
    background: rgba(0,229,160,0.08);
    border-color: var(--green);
    color: var(--green);
    box-shadow: var(--glow-green), inset 0 0 10px rgba(0,229,160,0.05);
  }

  /* Main timer card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.6;
  }

  .card-inner {
    padding: 32px 28px 28px;
  }

  /* Countdown display */
  .countdown-wrap {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }

  .countdown-label {
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .countdown {
    font-family: 'Orbitron', sans-serif;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    transition: color 0.3s;
  }

  .countdown.green  { color: var(--green);  text-shadow: var(--glow-green); }
  .countdown.amber  { color: var(--amber);  text-shadow: var(--glow-amber); }
  .countdown.red    { color: var(--red);    text-shadow: var(--glow-red); }

  .countdown-sub {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 24px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .progress-track {
    height: 4px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.5s linear, background 0.3s;
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 4px;
    background: white;
    filter: blur(2px);
    opacity: 0.8;
  }

  .progress-fill.amber { background: var(--amber); }
  .progress-fill.red   { background: var(--red); }

  /* Stats row */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    margin-bottom: 0;
  }

  .stat {
    background: var(--surface);
    padding: 14px 10px;
    text-align: center;
  }

  .stat-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Candle visual */
  .candle-section {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 20px;
    padding: 20px 0 24px;
  }

  .candle-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .candle-wick-top, .candle-wick-bot {
    width: 2px;
    background: var(--muted);
    border-radius: 1px;
  }

  .candle-body {
    width: 18px;
    border-radius: 1px;
    transition: height 0.5s linear;
  }

  .candle-body.bull { background: var(--green); box-shadow: 0 0 8px rgba(0,229,160,0.4); }
  .candle-body.bear { background: var(--red);   box-shadow: 0 0 8px rgba(255,77,106,0.4); }
  .candle-body.current { opacity: 0.5; animation: pulse-body 1s ease-in-out infinite alternate; }

  @keyframes pulse-body {
    from { opacity: 0.4; }
    to   { opacity: 0.8; }
  }

  /* Bottom bar */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 28px;
    border-top: 1px solid var(--border);
  }

  .clock {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .clock span { color: var(--text); }

  .signal {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: var(--glow-green);
    animation: blink 1.4s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Alert flash */
  .alert-flash {
    position: fixed;
    inset: 0;
    background: rgba(255,77,106,0.06);
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.1s;
  }

  .alert-flash.show { opacity: 1; }

  /* Corner deco */
  .corner { position: absolute; width: 12px; height: 12px; }
  .corner.tl { top: 0; left: 0;  border-top: 1px solid var(--green); border-left: 1px solid var(--green); }
  .corner.tr { top: 0; right: 0; border-top: 1px solid var(--green); border-right: 1px solid var(--green); }
  .corner.bl { bottom: 0; left: 0;  border-bottom: 1px solid var(--green); border-left: 1px solid var(--green); }
  .corner.br { bottom: 0; right: 0; border-bottom: 1px solid var(--green); border-right: 1px solid var(--green); }

  /* Sound toggle */
  .sound-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 5px 10px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .sound-btn:hover { border-color: var(--green-dim); color: var(--text); }
  .sound-btn.on { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<div class="alert-flash" id="flash"></div>

<div class="app">
  <div class="header">
    <div class="header-label">Trading Tools</div>
    <div class="header-title">Candle Timer</div>
  </div>

  <!-- Timeframe buttons -->
  <div class="tf-grid">
    <button class="tf-btn" data-tf="60">1M</button>
    <button class="tf-btn" data-tf="300">5M</button>
    <button class="tf-btn" data-tf="900">15M</button>
    <button class="tf-btn" data-tf="1800">30M</button>
    <button class="tf-btn active" data-tf="3600">1H</button>
    <button class="tf-btn" data-tf="14400">4H</button>
    <button class="tf-btn" data-tf="86400">D1</button>
  </div>

  <!-- Main card -->
  <div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="card-inner">

      <!-- Candle visual -->
      <div class="candle-section" id="candleSection"></div>

      <!-- Countdown -->
      <div class="countdown-wrap">
        <div class="countdown-label">Clôture dans</div>
        <div class="countdown green" id="countdown">00:00:00</div>
        <div class="countdown-sub" id="subtext">PROCHAINE BOUGIE</div>
      </div>

      <!-- Progress -->
      <div class="progress-wrap">
        <div class="progress-header">
          <span>OUVERTURE</span>
          <span id="pctText">0%</span>
          <span>CLÔTURE</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill green" id="progressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="statTF">1H</div>
        <div class="stat-label">Timeframe</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statElapsed">00:00</div>
        <div class="stat-label">Écoulé</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statCandles">—</div>
        <div class="stat-label">Bougies/jour</div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom-bar">
      <div class="clock">UTC <span id="clockDisplay">--:--:--</span></div>
      <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">🔔 SON ON</button>
      <div class="signal"><div class="dot"></div> LIVE</div>
    </div>
  </div>
</div>

<script>
  let currentTF = 3600;
  let soundEnabled = true;

  const timeframes = {
    60:    { label: '1M',  candlesPerDay: 1440 },
    300:   { label: '5M',  candlesPerDay: 288 },
    900:   { label: '15M', candlesPerDay: 96 },
    1800:  { label: '30M', candlesPerDay: 48 },
    3600:  { label: '1H',  candlesPerDay: 24 },
    14400: { label: '4H',  candlesPerDay: 6 },
    86400: { label: 'D1',  candlesPerDay: 1 },
  };

  // Candle history (random decorative)
  function buildCandles() {
    const section = document.getElementById('candleSection');
    section.innerHTML = '';
    const candles = [
      { bull: true,  bodyH: 38, wickT: 8,  wickB: 5 },
      { bull: false, bodyH: 24, wickT: 12, wickB: 4 },
      { bull: true,  bodyH: 45, wickT: 6,  wickB: 10 },
      { bull: false, bodyH: 18, wickT: 5,  wickB: 8 },
      { bull: true,  bodyH: 32, wickT: 10, wickB: 6 },
    ];

    candles.forEach((c, i) => {
      const g = document.createElement('div');
      g.className = 'candle-group';
      g.innerHTML = `
        <div class="candle-wick-top" style="height:${c.wickT}px"></div>
        <div class="candle-body ${c.bull ? 'bull' : 'bear'}${i === 4 ? ' current' : ''}" style="height:${c.bodyH}px"></div>
        <div class="candle-wick-bot" style="height:${c.wickB}px"></div>
      `;
      section.appendChild(g);
    });
  }

  function formatTime(seconds) {
    if (seconds < 0) seconds = 0;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (currentTF >= 86400) {
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    if (currentTF >= 3600) {
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function formatElapsed(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function getColor(pct) {
    if (pct > 85) return 'red';
    if (pct > 65) return 'amber';
    return 'green';
  }

  let lastSecond = -1;
  let alertedClose = false;

  function tick() {
    const now = Math.floor(Date.now() / 1000);
    const tf = currentTF;

    const elapsed = now % tf;
    const remaining = tf - elapsed;
    const pct = Math.round((elapsed / tf) * 100);

    // Clock UTC
    const d = new Date();
    const utc = `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')}`;
    document.getElementById('clockDisplay').textContent = utc;

    // Countdown
    const countdownEl = document.getElementById('countdown');
    const color = getColor(pct);
    countdownEl.textContent = formatTime(remaining);
    countdownEl.className = `countdown ${color}`;

    // Sub text
    const sub = document.getElementById('subtext');
    if (remaining <= 5) {
      sub.textContent = '⚡ CLÔTURE IMMINENTE';
      if (!alertedClose && soundEnabled) {
        playBeep();
        alertedClose = true;
        flashScreen();
      }
    } else {
      sub.textContent = 'PROCHAINE BOUGIE';
      alertedClose = false;
    }

    // Progress
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = `progress-fill ${color}`;
    document.getElementById('pctText').textContent = pct + '%';

    // Stats
    document.getElementById('statElapsed').textContent = formatElapsed(elapsed);
    document.getElementById('statCandles').textContent = timeframes[tf].candlesPerDay;

    // Update current candle body height (visual)
    const bodies = document.querySelectorAll('.candle-body.current');
    bodies.forEach(b => {
      b.style.height = Math.max(6, Math.round((pct / 100) * 55)) + 'px';
    });

    lastSecond = now;
  }

  function flashScreen() {
    const flash = document.getElementById('flash');
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 300);
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [880, 1100].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.25);
        osc.start(ctx.currentTime + i * 0.15);
        osc.stop(ctx.currentTime + i * 0.15 + 0.3);
      });
    } catch(e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundBtn');
    btn.textContent = soundEnabled ? '🔔 SON ON' : '🔕 SON OFF';
    btn.className = soundEnabled ? 'sound-btn on' : 'sound-btn';
  }

  // TF buttons
  document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTF = parseInt(btn.dataset.tf);
      document.getElementById('statTF').textContent = timeframes[currentTF].label;
      alertedClose = false;
    });
  });

  buildCandles();
  tick();
  setInterval(tick, 500);
</script>
</body>
</html>
